name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      # No dependencies at all (the build is plain node:fs), so there is
      # nothing to install and no lockfile to be missing.
      - name: Build lib/ from src/
        run: node scripts/build.mjs

      # lib/ is committed because users install the prebuilt package. A build
      # that disagrees with the committed lib/ means someone edited src/
      # without rebuilding.
      - name: lib/ matches src/
        shell: bash
        run: |
          if [ -n "$(git status --porcelain -- lib)" ]; then
            git status --porcelain -- lib
            echo "::error::lib/ is out of date - run the build and commit the result"
            exit 1
          fi

      - name: Unit tests
        run: npm test
